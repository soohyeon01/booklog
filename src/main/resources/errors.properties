# == Bean Validation ==

# title
NotBlank.book.title=제목은 필수 입력값입니다.
Size.book.title=제목은 50자 이하로 입력해주세요.

# author
NotBlank.book.author=저자는 필수 입력값입니다.
Size.book.author=저자는 50자 이하로 입력해주세요.

# status
NotNull.book.status=독서 상태를 선택해주세요.

# rating
Min.book.rating=평점은 1점 이상이어야 합니다.
Max.book.rating=평점은 5점 이하여야 합니다.

# summary
Size.book.summary=한줄평은 100자 이하로 입력해주세요.

# memo
Size.book.memo=메모는 500자 이하로 입력해주세요.