<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/base :: commonHead}">
    <title>책 상세 정보 - BookLog</title>
</head>
<body>

<header th:replace="~{fragment/base :: mainHeader('도서 상세 정보')}"></header>

<main class="container my-5" style="max-width: 700px;">

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show mb-4 fw-bold shadow-sm" role="alert">
        ✨ <span th:text="${message}">알림 메시지 영역</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h3 class="fw-bold text-dark mb-0">도서 상세 정보</h3>
            <span class="badge bg-secondary py-2 px-3 fs-6">ID: <span th:text="${book.id}">1</span></span>
        </div>

        <div class="list-group list-group-flush mb-4">

            <!-- 제목 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">제목</div>
                    <div class="col-sm-9">
                        <h4 class="fw-bold text-primary mb-0" th:text="${book.title}">데미안</h4>
                    </div>
                </div>
            </div>

            <!-- 저자 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">저자</div>
                    <div class="col-sm-9 fw-semibold text-dark">
                        <span th:each="author, iterStat : ${book.authors}">
                        <span th:text="${author.name}">저자명</span>
                            <span th:if="${!iterStat.last}">, </span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- 독서 상태 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">독서 상태</div>
                    <div class="col-sm-9">
                        <span th:if="${book.status.name() == 'WISH'}"
                              class="badge bg-warning text-white py-2 px-3 fw-bold">읽고 싶은 책</span>
                        <span th:if="${book.status.name() == 'READING'}"
                              class="badge bg-info text-white py-2 px-3 fw-bold">읽는 중</span>
                        <span th:if="${book.status.name() == 'DONE'}"
                              class="badge bg-success py-2 px-3 fw-bold">완독</span>
                    </div>
                </div>
            </div>

            <!-- 평점 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">평점</div>
                    <div class="col-sm-9 text-warning fs-5"
                         th:if="${book.rating != null}"
                         th:text="${#strings.repeat('⭐', book.rating)}">⭐⭐⭐⭐⭐
                    </div>
                </div>
            </div>

            <!-- 한줄평 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">한줄평</div>
                    <div class="col-sm-9 text-muted fst-italic"
                         th:text="${book.summary}">내면의 성장을 이끄는 최고의 책
                    </div>
                </div>
            </div>

            <!-- 상세 메모 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">상세 메모</div>
                    <div class="col-sm-9">
                        <div class="bg-light p-3 rounded border text-dark"
                             style="min-height: 100px; white-space: pre-wrap;" th:text="${book.memo}">
                            싱클레어가 크로머를 만나고...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 태그 -->
            <div class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-3 text-secondary fw-semibold">태그</div>
                    <div class="col-sm-9">
                        <a th:each="tag : ${book.tags}" th:href="@{/books(keyword=${tag.name})}"
                           class="badge rounded-pill bg-light text-dark border text-decoration-none me-1"
                           th:text="'#' + ${tag.name}">#소설</a>
                        <span th:if="${book.tags.isEmpty()}" class="text-muted">-</span>
                    </div>
                </div>
            </div>

        </div>

        <hr class="my-4">

        <!-- 도서 관리 버튼 -->
        <div class="d-flex justify-content-between align-items-center">
            <button type="button"
                    class="btn btn-outline-secondary px-3 fw-bold"
                    th:onclick="|location.href='@{/books}'|">
                목록으로
            </button>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary px-3 fw-bold shadow-sm"
                        th:onclick="|location.href='@{/books/{bookId}/edit(bookId=${book.id})}'|">
                    수정하기
                </button>

                <form th:action="@{/books/{bookId}/delete(bookId=${book.id})}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('정말 이 책을 삭제하시겠습니까?');"
                            class="btn btn-outline-danger px-3 fw-bold">
                        삭제하기
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- 독서 기록 -->
    <section class="card shadow-sm p-4 mt-4">

        <h4 class="fw-bold text-dark mb-3">
            독서 기록
            <span class="badge bg-secondary"
                  th:text="${#lists.size(logs)}">0</span>
        </h4>

        <div th:if="${logError}" class="alert alert-danger py-2" th:text="${logError}">오류</div>

        <!-- 새 독서 기록 등록 폼 -->
        <form th:action="@{/books/{bookId}/logs(bookId=${book.id})}" method="post" class="mb-4">

            <label for="readingDate" class="form-label fw-semibold">
                읽은 날짜
            </label>

            <input type="date" id="readingDate" name="readingDate" class="form-control form-control-sm mb-2" style="max-width: 200px;"
                   th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                   th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">

            <label for="content" class="form-label fw-semibold">
                기록 내용
            </label>

            <textarea id="content" name="content" rows="3" maxlength="1000" class="form-control mb-2"
                      placeholder="오늘 읽은 부분이나 떠오른 생각을 남겨보세요"></textarea>

            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-sm fw-bold">기록 추가</button>
            </div>
        </form>

        <!-- 기록이 없는 경우 -->
        <div th:if="${#lists.isEmpty(logs)}" class="text-muted text-center py-3">
            아직 남긴 기록이 없습니다.
        </div>

        <!-- 기존 독서 기록 목록 -->
        <ul class="list-group list-group-flush">
            <li class="list-group-item px-0" th:each="log : ${logs}">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div class="flex-grow-1">

                        <!-- readingDate는 LocalDate이므로 날짜만 출력 -->
                        <div class="small text-secondary mb-1"
                             th:text="${log.readingDate != null
                                ? #temporals.format(log.readingDate, 'yyyy-MM-dd')
                                : '-'}">
                            2026-10-01
                        </div>


                        <div style="white-space: pre-wrap;"
                             th:text="${log.content}">기록 내용
                        </div>
                    </div>

                    <!-- 독서 기록 삭제 -->
                    <form th:action="@{/books/{bookId}/logs/{logId}/delete(bookId=${book.id}, logId=${log.id})}"
                          method="post">
                        <button type="submit" onclick="return confirm('해당 기록을 삭제할까요?');"
                                class="btn btn-sm btn-outline-danger py-0 px-2">삭제
                        </button>
                    </form>
                </div>

            </li>
        </ul>

    </section>
</main>

<footer th:replace="~{fragment/base :: mainFooter}"></footer>
</body>
</html>
