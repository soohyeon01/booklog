<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/base :: commonHead}">
    <title>로그인 - BookLog</title>
</head>

<body>

<header th:replace="~{fragment/base :: mainHeader('로그인')}"></header>

<main class="container my-5" style="max-width: 400px;">

    <section class="card shadow-sm p-4">
        <h3 class="mb-4 fw-bold text-dark border-bottom pb-2">BookLog 로그인</h3>

        <!-- ${param.error}는 LoginController 에서 return "redirect:/login?error" 와 대응됨 -->
        <div th:if="${param.error}" class="alert alert-danger py-2 mb-3">
            아이디 또는 비밀번호가 일치하지 않습니다.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label for="loginId" class="form-label fw-semibold">아이디</label>
                <input type="text" id="loginId" name="loginId" class="form-control" placeholder="아이디를 입력하세요">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                로그인
            </button>

        </form>

    </section>

</main>

<footer th:replace="~{fragment/base :: mainFooter}"></footer>

</body>
</html>
